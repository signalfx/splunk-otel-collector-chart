{{- if .Values.remoteManagement.enabled }}
{{- include "splunk-otel-collector.opampBridge.requireManagedWorkload" . }}
{{- $namespace := include "splunk-otel-collector.namespace" . }}
{{- $bridge := .Values.remoteManagement.opampBridge }}
{{- $serviceAccountName := include "splunk-otel-collector.opampBridgeServiceAccountName" . }}
{{- if $bridge.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: true
{{- if .Values.image.imagePullSecrets }}
imagePullSecrets:
{{- range .Values.image.imagePullSecrets }}
  - name: {{ . }}
{{- end }}
{{- end }}
metadata:
  name: {{ $serviceAccountName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "splunk-otel-collector.commonLabels" . | nindent 4 }}
    app: {{ template "splunk-otel-collector.name" . }}
    component: opamp-bridge
    chart: {{ template "splunk-otel-collector.chart" . }}
    release: {{ .Release.Name }}
  {{- if $bridge.serviceAccount.annotations }}
  annotations:
    {{- toYaml $bridge.serviceAccount.annotations | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
