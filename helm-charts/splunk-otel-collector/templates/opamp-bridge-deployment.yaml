{{- if .Values.remoteManagement.enabled }}
{{- include "splunk-otel-collector.opampBridge.requireManagedWorkload" . }}
{{- $namespace := include "splunk-otel-collector.namespace" . }}
{{- $bridge := .Values.remoteManagement.opampBridge }}
{{- $bridgeName := include "splunk-otel-collector.opampBridgeName" . }}
{{- $configMapName := include "splunk-otel-collector.opampBridgeConfigMapName" . }}
{{- $serviceAccountName := include "splunk-otel-collector.opampBridgeServiceAccountName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $bridgeName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "splunk-otel-collector.commonLabels" . | nindent 4 }}
    app: {{ template "splunk-otel-collector.name" . }}
    component: opamp-bridge
    chart: {{ template "splunk-otel-collector.chart" . }}
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ template "splunk-otel-collector.name" . }}
      component: opamp-bridge
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ template "splunk-otel-collector.name" . }}
        component: opamp-bridge
        release: {{ .Release.Name }}
        {{- if $bridge.podLabels }}
        {{- toYaml $bridge.podLabels | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ printf "%s\n%s\n%s" (toYaml $bridge) (include "splunk-otel-collector.opampBridgeEndpoint" .) .Values.clusterName | sha256sum }}
        {{- if $bridge.podAnnotations }}
        {{- toYaml $bridge.podAnnotations | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $serviceAccountName }}
      {{- if .Values.image.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.image.imagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      {{- with $bridge.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- if $bridge.nodeSelector }}
        {{- toYaml $bridge.nodeSelector | nindent 8 }}
        {{- else }}
        kubernetes.io/os: linux
        {{- end }}
      {{- if $bridge.tolerations }}
      tolerations:
        {{- toYaml $bridge.tolerations | nindent 8 }}
      {{- end }}
      {{- if $bridge.affinity }}
      affinity:
        {{- toYaml $bridge.affinity | nindent 8 }}
      {{- end }}
      {{- if $bridge.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml $bridge.topologySpreadConstraints | nindent 8 }}
      {{- end }}
      {{- if $bridge.priorityClassName }}
      priorityClassName: {{ $bridge.priorityClassName }}
      {{- end }}
      containers:
        - name: bridge
          image: {{ include "splunk-otel-collector.image.opampBridge" . }}
          imagePullPolicy: {{ $bridge.image.pullPolicy }}
          args:
            - --config-file=/conf/config.yaml
            - --mode=standalone
          {{- if or (eq (include "splunk-otel-collector.splunkO11yEnabled" .) "true") $bridge.extraEnvs }}
          env:
            {{- if eq (include "splunk-otel-collector.splunkO11yEnabled" .) "true" }}
            - name: SPLUNK_OBSERVABILITY_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "splunk-otel-collector.secret" . }}
                  key: splunk_observability_access_token
            {{- end }}
            {{- with $bridge.extraEnvs }}
            {{- . | toYaml | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: healthz
              containerPort: 8081
              protocol: TCP
          {{- with $bridge.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $bridge.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            {{- if $bridge.extraVolumeMounts }}
            {{- toYaml $bridge.extraVolumeMounts | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $configMapName }}
        {{- if $bridge.extraVolumes }}
        {{- toYaml $bridge.extraVolumes | nindent 8 }}
        {{- end }}
{{- end }}
