name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Helm
      uses: ./.github/actions/setup-helm
    - name: Run pre-commit
      run: |
        pip install pre-commit==4.5.1
        pre-commit run --all-files
      env:
        SKIP: actionlint
