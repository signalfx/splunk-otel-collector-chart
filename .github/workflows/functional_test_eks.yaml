name: functional-tests-eks

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:
    inputs:
      COLLECTOR_IMAGE:
        description: 'COLLECTOR_IMAGE: Optional collector image override for cloud functional tests. Must use an approved Splunk collector repository on quay.io.'
        required: false
        default: 'quay.io/signalfx/splunk-otel-collector-dev:latest'
        type: string

permissions:
  contents: read

jobs:
  chart-release-fast-gate:
    # Emit the required check immediately for PRs that are not the internal
    # update-release PR. This job never checks out or executes PR code.
    name: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.head.ref != 'update-release') && 'Chart release gate' || 'Chart release gate pending required checks' }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report release gate status
        run: echo "The full chart release gate is required only for the internal update-release pull request."

  collector-image-config:
    name: Resolve EKS test configuration
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    outputs:
      cloud-tests-enabled: ${{ steps.config.outputs.cloud-tests-enabled }}
      eks-tests-recommended: ${{ steps.eks-scope.outputs.recommended }}
      otelcol-image: ${{ steps.config.outputs.otelcol-image }}
      release-required: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'update-release' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # This is a UX filter only; environment approval remains the access boundary,
      # and release PRs and manual runs always enable the EKS jobs.
      - name: Determine whether EKS tests are recommended
        id: eks-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          RELEASE_REQUIRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'update-release' }}
        shell: bash
        run: |
          set -euo pipefail

          recommended=true
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            message="EKS tests were requested manually. Approve the EKS test environment to run them."
          elif [[ "$RELEASE_REQUIRED" == "true" ]]; then
            message="EKS tests are required for this release pull request. Approve the EKS test environment to run them."
          elif [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            message="EKS tests are recommended because the changed-file scope could not be determined."
            echo "::warning title=EKS functional tests::$message"
          else
            diff_status=0
            git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
              helm-charts/splunk-otel-collector \
              functional_tests \
              .github/actions/cloud-functional-test \
              .github/actions/cloud-test-config \
              .github/workflows/eks-privileged-tests.yaml \
              .github/workflows/functional_test_eks.yaml \
              Makefile \
              Makefile.common || diff_status=$?

            case "$diff_status" in
              0)
                recommended=false
                message="EKS tests are not recommended for the files changed by this pull request; no environment approval is needed."
                ;;
              1)
                message="EKS tests are recommended because this pull request changes the chart or its EKS functional-test path. Approve the EKS test environment to run them."
                ;;
              *)
                message="EKS tests are recommended because changed-file classification failed."
                echo "::warning title=EKS functional tests::$message"
                ;;
            esac
          fi

          approval_guidance="Approval authorizes this workflow run to access isolated non-production EKS test clusters. Review the code and ref before approving."
          echo "recommended=${recommended}" >> "$GITHUB_OUTPUT"
          {
            echo "### EKS functional tests"
            echo
            echo "$message"
            if [[ "$recommended" == "true" ]]; then
              echo
              echo "**Before approving:** $approval_guidance"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$recommended" == "true" ]]; then
            echo "::notice title=EKS functional tests::$message $approval_guidance"
          else
            echo "::notice title=EKS functional tests::$message"
          fi

      - name: Resolve collector image and cloud-test gating
        id: config
        uses: ./.github/actions/cloud-test-config
        with:
          collector-image: ${{ github.event.inputs.COLLECTOR_IMAGE || '' }}
          event-name: ${{ github.event_name }}
          pr-repo-full-name: ${{ github.event.pull_request.head.repo.full_name || '' }}
          pr-user-login: ${{ github.event.pull_request.user.login || '' }}
          ref: ${{ github.ref }}
          repository: ${{ github.repository }}

  eks-tests-recommended:
    name: EKS tests recommended - approval required
    needs: collector-image-config
    if: ${{ needs.collector-image-config.outputs.cloud-tests-enabled == 'true' && needs.collector-image-config.outputs.eks-tests-recommended == 'true' }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Surface EKS test recommendation
        run: |
          echo "EKS functional tests are recommended for this change. Approve the EKS test environment to run them."
          echo "### EKS tests recommended" >> "$GITHUB_STEP_SUMMARY"
          echo "Approve the EKS test environment to run the functional tests for this change." >> "$GITHUB_STEP_SUMMARY"

  eks-functional-tests:
    name: EKS functional tests
    needs: collector-image-config
    if: ${{ needs.collector-image-config.outputs.cloud-tests-enabled == 'true' && needs.collector-image-config.outputs.eks-tests-recommended == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: signalfx/splunk-otel-collector-chart/.github/workflows/eks-privileged-tests.yaml@main
    with:
      otelcol-image: ${{ needs.collector-image-config.outputs.otelcol-image }}

  release-readiness:
    name: Validate chart release readiness
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'update-release' }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default pull_request checkout is the synthetic merge of the release
      # branch and current main, so entries merged after the draft was created
      # remain visible here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for pending changelog entries
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          pending_entries=()
          for entry in .chloggen/*.yaml; do
            if [[ "$entry" != ".chloggen/TEMPLATE.yaml" ]]; then
              pending_entries+=("$entry")
            fi
          done

          if (( ${#pending_entries[@]} > 0 )); then
            echo "::error title=Chart release readiness::Pending changelog entries remain; see the job log for details."
            echo "The release pull request does not include all changelog entries currently on main."
            printf 'Pending entry: %s\n' "${pending_entries[@]}"
            echo "Update or recreate the release pull request before merging it."
            exit 1
          fi

          echo "The release pull request includes all current changelog entries."

      - name: Check for pending dependency updates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          open_prs="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 1000 \
            --json headRefName,isCrossRepository,labels,number,url)"

          blocking_prs="$(jq -r '
            .[]
            | select(.isCrossRepository == false)
            | select(
                .headRefName == "update-TargetAllocator"
                or .headRefName == "update-operator"
                or .headRefName == "update-java"
                or .headRefName == "update-nodejs"
                or .headRefName == "update-dotnet"
                or .headRefName == "update-java-csa"
                or .headRefName == "update-python-secureapp"
              )
            | select(any(.labels[]?; .name == "blocked") | not)
            | "#\(.number) (\(.headRefName)): \(.url)"
          ' <<< "$open_prs")"

          if [[ -n "$blocking_prs" ]]; then
            echo "::error title=Chart release readiness::Required dependency updates remain open; see the job log for details."
            echo "Merge these dependency updates before releasing, or add the blocked label when an update is intentionally deferred:"
            printf '%s\n' "$blocking_prs"
            exit 1
          fi

          echo "No unblocked TA, operator, or instrumentation dependency update PRs are open."

  chart-release-gate:
    # Only release PRs expose the required check name here; other runs report optional results.
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'update-release' && 'Chart release gate' || 'EKS results (optional)' }}
    needs:
      - eks-functional-tests
      - release-readiness
    # Evaluate every result so release PRs fail closed on failures, skips, or cancellation.
    if: ${{ always() }}
    permissions: {}
    runs-on: ubuntu-latest
    env:
      RELEASE_REQUIRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'update-release' }}
      EKS_TEST_RESULT: ${{ needs.eks-functional-tests.result }}
      RELEASE_READINESS_RESULT: ${{ needs.release-readiness.result }}
    steps:
      - name: Verify chart release gate
        run: |
          if [[ "$RELEASE_REQUIRED" != "true" ]]; then
            echo "EKS tests are not required for this pull request."
            exit 0
          fi

          if [[ "$EKS_TEST_RESULT" != "success" ]]; then
            echo "::error title=Chart release gate::The required EKS functional tests did not pass."
            echo "All EKS functional tests must pass before merging the release pull request."
            echo "EKS reusable workflow result: $EKS_TEST_RESULT"
            exit 1
          fi

          if [[ "$RELEASE_READINESS_RESULT" != "success" ]]; then
            echo "::error title=Chart release gate::The chart release readiness checks did not pass."
            echo "The chart release readiness checks must pass before merging the release pull request."
            echo "Release readiness result: $RELEASE_READINESS_RESULT"
            exit 1
          fi

          echo "All required EKS functional tests and chart release readiness checks passed."
