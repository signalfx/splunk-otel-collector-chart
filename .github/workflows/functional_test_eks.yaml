name: functional-tests-eks

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:
    inputs:
      COLLECTOR_IMAGE:
        description: 'COLLECTOR_IMAGE: Optional collector image override for cloud functional tests. Must use an approved Splunk collector repository on quay.io.'
        required: false
        default: 'quay.io/signalfx/splunk-otel-collector-dev:latest'
        type: string

permissions:
  contents: read

env:
  GO_VERSION: 1.26.6
  # Make sure to exit early if cache segment download times out after 2 minutes.
  # We limit cache download as a whole to 5 minutes.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

jobs:
  collector-image-config:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    outputs:
      cloud-tests-enabled: ${{ steps.config.outputs.cloud-tests-enabled }}
      otelcol-image: ${{ steps.config.outputs.otelcol-image }}
      release-required: ${{ steps.policy.outputs.release-required }}
      run-eks-tests: ${{ steps.policy.outputs.run-eks-tests }}
    steps:
      - name: Resolve EKS test policy
        id: policy
        env:
          IS_MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          IS_RELEASE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'update-release' }}
          RUN_EKS_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-eks-tests') }}
        run: |
          echo "release-required=$IS_RELEASE_PR" >> "$GITHUB_OUTPUT"
          if [[ "$IS_MANUAL_RUN" == "true" || "$IS_RELEASE_PR" == "true" || "$RUN_EKS_LABEL" == "true" ]]; then
            echo "run-eks-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run-eks-tests=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve collector image and cloud-test gating
        id: config
        uses: ./.github/actions/cloud-test-config
        with:
          collector-image: ${{ github.event.inputs.COLLECTOR_IMAGE || '' }}
          event-name: ${{ github.event_name }}
          pr-repo-full-name: ${{ github.event.pull_request.head.repo.full_name || '' }}
          pr-user-login: ${{ github.event.pull_request.user.login || '' }}
          ref: ${{ github.ref }}
          repository: ${{ github.repository }}

  eks-test:
    name: Test helm install in EKS - credentials needed
    needs: collector-image-config
    if: ${{ needs.collector-image-config.outputs.cloud-tests-enabled == 'true' && needs.collector-image-config.outputs.run-eks-tests == 'true' }}
    environment:
      name: aws-eks-functional-tests
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: eks-cluster-rotel-eks
      queue: max
    continue-on-error: ${{ needs.collector-image-config.outputs.release-required != 'true' && contains(github.event.pull_request.labels.*.name, 'Ignore Tests') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/eks-functional-test
        with:
          aws-access-key-id: ${{ secrets.AWS_EKS_ACCESS_KEY_ID }}
          aws-cluster-name: rotel-eks
          aws-region: us-west-1
          aws-secret-access-key: ${{ secrets.AWS_EKS_SECRET_ACCESS_KEY }}
          go-version: ${{ env.GO_VERSION }}
          kube-test-env: eks
          kubeconfig-path: /tmp/kube-config-splunk-otel-collector-chart-functional-testing-eks
          otelcol-image: ${{ needs.collector-image-config.outputs.otelcol-image }}

  eks-upgrade-test:
    name: Test helm upgrade in EKS - credentials needed
    needs: collector-image-config
    if: ${{ needs.collector-image-config.outputs.cloud-tests-enabled == 'true' && needs.collector-image-config.outputs.run-eks-tests == 'true' }}
    environment:
      name: aws-eks-functional-tests
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: eks-cluster-rotel-eks
      queue: max
    continue-on-error: ${{ needs.collector-image-config.outputs.release-required != 'true' && contains(github.event.pull_request.labels.*.name, 'Ignore Tests') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/eks-functional-test
        with:
          aws-access-key-id: ${{ secrets.AWS_EKS_ACCESS_KEY_ID }}
          aws-cluster-name: rotel-eks
          aws-region: us-west-1
          aws-secret-access-key: ${{ secrets.AWS_EKS_SECRET_ACCESS_KEY }}
          go-version: ${{ env.GO_VERSION }}
          kube-test-env: eks
          kubeconfig-path: /tmp/kube-config-splunk-otel-collector-chart-functional-testing-eks
          mode: upgrade
          otelcol-image: ${{ needs.collector-image-config.outputs.otelcol-image }}
          upgrade-from-values: eks_upgrade_from_previous_release_values.yaml

  eks-fargate-test:
    name: Test helm install in EKS Fargate - credentials needed
    needs: collector-image-config
    if: ${{ needs.collector-image-config.outputs.cloud-tests-enabled == 'true' && needs.collector-image-config.outputs.run-eks-tests == 'true' }}
    environment:
      name: aws-eks-functional-tests
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: eks-cluster-gdi-github-eks-fargate
      queue: max
    continue-on-error: ${{ needs.collector-image-config.outputs.release-required != 'true' && contains(github.event.pull_request.labels.*.name, 'Ignore Tests') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/eks-functional-test
        with:
          aws-access-key-id: ${{ secrets.AWS_EKS_ACCESS_KEY_ID }}
          aws-cluster-name: gdi-github-eks-fargate
          aws-region: us-west-2
          aws-secret-access-key: ${{ secrets.AWS_EKS_SECRET_ACCESS_KEY }}
          go-version: ${{ env.GO_VERSION }}
          kube-test-env: eks/fargate
          kubeconfig-path: /tmp/kube-config-splunk-otel-collector-chart-functional-testing-eks-fargate
          otelcol-image: ${{ needs.collector-image-config.outputs.otelcol-image }}
          skip-tests: "true" # we need to skip functional tests as we have not set probes to listen to the traffic.

  eks-fargate-upgrade-test:
    name: Test helm upgrade in EKS Fargate - credentials needed
    needs: collector-image-config
    if: ${{ needs.collector-image-config.outputs.cloud-tests-enabled == 'true' && needs.collector-image-config.outputs.run-eks-tests == 'true' }}
    environment:
      name: aws-eks-functional-tests
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: eks-cluster-gdi-github-eks-fargate
      queue: max
    continue-on-error: ${{ needs.collector-image-config.outputs.release-required != 'true' && contains(github.event.pull_request.labels.*.name, 'Ignore Tests') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/eks-functional-test
        with:
          aws-access-key-id: ${{ secrets.AWS_EKS_ACCESS_KEY_ID }}
          aws-cluster-name: gdi-github-eks-fargate
          aws-region: us-west-2
          aws-secret-access-key: ${{ secrets.AWS_EKS_SECRET_ACCESS_KEY }}
          go-version: ${{ env.GO_VERSION }}
          kube-test-env: eks/fargate
          kubeconfig-path: /tmp/kube-config-splunk-otel-collector-chart-functional-testing-eks-fargate
          mode: upgrade
          otelcol-image: ${{ needs.collector-image-config.outputs.otelcol-image }}
          skip-tests: "true" # we need to skip functional tests as we have not set probes to listen to the traffic.
          upgrade-from-values: eks_fargate_upgrade_from_previous_release_values.yaml

  eks-auto-mode-test:
    name: Test helm install in EKS Auto Mode - credentials needed
    needs: collector-image-config
    if: ${{ needs.collector-image-config.outputs.cloud-tests-enabled == 'true' && needs.collector-image-config.outputs.run-eks-tests == 'true' }}
    environment:
      name: aws-eks-functional-tests
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: eks-cluster-rotel-eks-autotest
      queue: max
    continue-on-error: ${{ needs.collector-image-config.outputs.release-required != 'true' && contains(github.event.pull_request.labels.*.name, 'Ignore Tests') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/eks-functional-test
        with:
          aws-access-key-id: ${{ secrets.AWS_EKS_ACCESS_KEY_ID }}
          aws-cluster-name: rotel-eks-autotest
          aws-region: us-west-2
          aws-secret-access-key: ${{ secrets.AWS_EKS_SECRET_ACCESS_KEY }}
          go-version: ${{ env.GO_VERSION }}
          kube-test-env: eks/auto-mode
          kubeconfig-path: /tmp/kube-config-splunk-otel-collector-chart-functional-testing-eks-auto-mode
          otelcol-image: ${{ needs.collector-image-config.outputs.otelcol-image }}

  eks-auto-mode-upgrade-test:
    name: Test helm upgrade in EKS Auto Mode - credentials needed
    needs: collector-image-config
    if: ${{ needs.collector-image-config.outputs.cloud-tests-enabled == 'true' && needs.collector-image-config.outputs.run-eks-tests == 'true' }}
    environment:
      name: aws-eks-functional-tests
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: eks-cluster-rotel-eks-autotest
      queue: max
    continue-on-error: ${{ needs.collector-image-config.outputs.release-required != 'true' && contains(github.event.pull_request.labels.*.name, 'Ignore Tests') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/eks-functional-test
        with:
          aws-access-key-id: ${{ secrets.AWS_EKS_ACCESS_KEY_ID }}
          aws-cluster-name: rotel-eks-autotest
          aws-region: us-west-2
          aws-secret-access-key: ${{ secrets.AWS_EKS_SECRET_ACCESS_KEY }}
          go-version: ${{ env.GO_VERSION }}
          kube-test-env: eks/auto-mode
          kubeconfig-path: /tmp/kube-config-splunk-otel-collector-chart-functional-testing-eks-auto-mode
          mode: upgrade
          otelcol-image: ${{ needs.collector-image-config.outputs.otelcol-image }}
          upgrade-from-values: eks_auto_mode_upgrade_from_previous_release_values.yaml

  release-eks-gate:
    name: EKS release gate
    needs:
      - eks-test
      - eks-upgrade-test
      - eks-fargate-test
      - eks-fargate-upgrade-test
      - eks-auto-mode-test
      - eks-auto-mode-upgrade-test
    # Evaluate every test result so release PRs fail closed on failures, skips, or cancellation.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      RELEASE_REQUIRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'update-release' }}
      EKS_TEST_RESULT: ${{ needs.eks-test.result }}
      EKS_UPGRADE_TEST_RESULT: ${{ needs.eks-upgrade-test.result }}
      EKS_FARGATE_TEST_RESULT: ${{ needs.eks-fargate-test.result }}
      EKS_FARGATE_UPGRADE_TEST_RESULT: ${{ needs.eks-fargate-upgrade-test.result }}
      EKS_AUTO_MODE_TEST_RESULT: ${{ needs.eks-auto-mode-test.result }}
      EKS_AUTO_MODE_UPGRADE_TEST_RESULT: ${{ needs.eks-auto-mode-upgrade-test.result }}
    steps:
      - name: Verify required EKS tests
        run: |
          if [[ "$RELEASE_REQUIRED" != "true" ]]; then
            echo "EKS tests are not required for this pull request."
            exit 0
          fi

          results=(
            "$EKS_TEST_RESULT"
            "$EKS_UPGRADE_TEST_RESULT"
            "$EKS_FARGATE_TEST_RESULT"
            "$EKS_FARGATE_UPGRADE_TEST_RESULT"
            "$EKS_AUTO_MODE_TEST_RESULT"
            "$EKS_AUTO_MODE_UPGRADE_TEST_RESULT"
          )
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "All EKS functional tests must pass before merging the release pull request."
              printf 'EKS job results: %s\n' "${results[*]}"
              exit 1
            fi
          done

          echo "All required EKS functional tests passed."
