name: functional-tests

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      UPDATE_EXPECTED_RESULTS:
        description: 'UPDATE_EXPECTED_RESULTS: Set this to true to update the golden file expected test results (if applicable) and upload them as a GitHub workflow run artifact.'
        required: false
        default: false
        type: choice
        options:
          - false
          - true
      KUBERNETES_DEBUG_INFO:
        description: 'KUBERNETES_DEBUG_INFO: Set this to true to collect the debug info of the k8s cluster and upload this info as a Github workflow artifact.'
        required: false
        default: false
        type: choice
        options:
          - false
          - true
      COLLECTOR_IMAGE:
        description: 'COLLECTOR_IMAGE: Optional collector image override for kind functional tests. Must use an approved Splunk collector repository on quay.io.'
        required: false
        default: 'quay.io/signalfx/splunk-otel-collector-dev:latest'
        type: string

permissions:
  contents: read

env:
  GO_VERSION: 1.26.6
  # Make sure to exit early if cache segment download times out after 2 minutes.
  # We limit cache download as a whole to 5 minutes.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

jobs:
  get-test-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: get matrix
        id: test_matrix
        run: |
          echo "Getting test matrix"
          matrix=$(jq -r '.functional_test_v2 | tostring' ci-matrix.json | tr -d '\n')
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
    outputs:
      matrix: ${{ steps.test_matrix.outputs.matrix }}

  collector-image-config:
    runs-on: ubuntu-latest
    outputs:
      otelcol-image: ${{ steps.config.outputs.otelcol-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve collector image
        id: config
        uses: ./.github/actions/cloud-test-config
        with:
          collector-image: ${{ github.event.inputs.COLLECTOR_IMAGE || '' }}
          event-name: ${{ github.event_name }}
          pr-repo-full-name: ${{ github.event.pull_request.head.repo.full_name || '' }}
          pr-user-login: ${{ github.event.pull_request.user.login || '' }}
          ref: ${{ github.ref }}
          repository: ${{ github.repository }}

  kubernetes-test:
    name: ${{ matrix.test-job }} on K8s ${{ matrix.k8s-kind-version }} with Helm ${{ matrix.helm.version }}
    env:
      KUBE_TEST_ENV: kind
      UPDATE_EXPECTED_RESULTS: ${{ github.event.inputs.UPDATE_EXPECTED_RESULTS || 'false' }}
      KUBERNETES_DEBUG_INFO: ${{ github.event.inputs.KUBERNETES_DEBUG_INFO || 'false' }}
    needs:
      - get-test-matrix
      - collector-image-config
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.get-test-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'Ignore Tests') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/functional-test
        with:
          artifact-suffix: ${{ matrix.test-job }}-${{ matrix.k8s-kind-version }}-${{ matrix.helm.version }}
          go-version: ${{ env.GO_VERSION }}
          go-test-tags: ${{ matrix.helm.go-test-tags }}
          helm-version: ${{ matrix.helm.version }}
          k8s-version: ${{ matrix.k8s-kind-version }}
          kubernetes-debug-info: ${{ env.KUBERNETES_DEBUG_INFO }}
          otelcol-image: ${{ needs.collector-image-config.outputs.otelcol-image }}
          suite: ${{ matrix.test-job }}
          update-expected-results: ${{ env.UPDATE_EXPECTED_RESULTS }}

  kubernetes-upgrade-test:
    name: Test helm upgrade in kind with Helm ${{ matrix.helm.version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'Ignore Tests') }}
    strategy:
      fail-fast: false
      matrix:
        helm:
          - version: v4.2.3
            go-test-tags: ''
          - version: v3.21.4
            go-test-tags: helm3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/functional-test
        with:
          go-version: ${{ env.GO_VERSION }}
          go-test-tags: ${{ matrix.helm.go-test-tags }}
          helm-version: ${{ matrix.helm.version }}
          k8s-version: v1.36.1
          mode: upgrade
          suite: functional
          update-expected-results: ${{ github.event.inputs.UPDATE_EXPECTED_RESULTS || 'false' }}
          upgrade-from-values: kind_upgrade_from_previous_release_values.yaml
