# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: breaking
# The name of the component, or a single word describing the area of concern, (e.g. agent, clusterReceiver, gateway, operator, chart, other)
component: chart
# A brief description of the change. Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Increase default collection interval to 1m across all periodical scrapers and receivers
# One or more tracking issues related to the change
issues: [2705]
# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  By moving to 1m by default, we reduce the number of data points emitted and therefore the expenditure of data collection.
  You can override these default settings through setting the `config` key of the agent and cluster_receiver.

  ```
  agent:
    enabled: true
    config:
      receivers:
        host_metrics:
          # Change to 10s
          collection_interval: 10s
        kubelet_stats:
          # Change to 10s
          collection_interval: 10s
        prometheus/agent:
          config:
            scrape_configs:
              - job_name: otel-agent
                metric_relabel_configs:
                  - action: drop
                    regex: promhttp_metric_handler_errors.*
                    source_labels:
                      - __name__
                  - action: drop
                    regex: otelcol_processor_batch_.*
                    source_labels:
                      - __name__
                  - action: drop
                    regex: .*otelcol\.k8s\.pod\.association
                    source_labels:
                      - __name__
                # Change to 10s
                scrape_interval: 10s
                static_configs:
                  - targets:
                      - localhost:8889

  gateway:
    enabled: true
    config:
      receivers:
        prometheus/collector:
          config:
            scrape_configs:
              - job_name: otel-collector
                metric_relabel_configs:
                - action: drop
                  regex: promhttp_metric_handler_errors.*
                  source_labels:
                  - __name__
                - action: drop
                  regex: otelcol_processor_batch_.*
                  source_labels:
                  - __name__
                - action: drop
                  regex: .*otelcol\.k8s\.pod\.association
                  source_labels:
                  - __name__
                # Change to 10s
                scrape_interval: 10s
                static_configs:
                  - targets:
                    - localhost:8889
  clusterReceiver:
    enabled: true
    config:
      receivers:
        prometheus/k8s_cluster_receiver:
          config:
            scrape_configs:
              - job_name: otel-k8s-cluster-receiver
                metric_relabel_configs:
                - action: drop
                  regex: promhttp_metric_handler_errors.*
                  source_labels:
                    - __name__
                - action: drop
                  regex: otelcol_processor_batch_.*
                  source_labels:
                    - __name__
                - action: drop
                  regex: .*otelcol\.k8s\.pod\.association
                  source_labels:
                    - __name__
                # Change to 10s
                scrape_interval: 10s
                static_configs:
                  - targets:
                    - localhost:8889

  ```

