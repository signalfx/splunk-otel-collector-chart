suite: splunk-otel-collector.k8sPersistentVolumeMetrics
values:
  - ./values/basic.yaml
release:
  name: test-release
  namespace: test-ns
templates:
  - configmap-cluster-receiver.yaml

tests:
  - it: enables all persistent volume and persistent volume claim metrics by default
    asserts:
      - matchRegex:
          path: data["relay"]
          pattern: "k8s\\.persistentvolume\\.status\\.phase:\\n\\s+enabled: true"
      - matchRegex:
          path: data["relay"]
          pattern: "k8s\\.persistentvolume\\.storage\\.capacity:\\n\\s+enabled: true"
      - matchRegex:
          path: data["relay"]
          pattern: "k8s\\.persistentvolumeclaim\\.status\\.phase:\\n\\s+enabled: true"
      - matchRegex:
          path: data["relay"]
          pattern: "k8s\\.persistentvolumeclaim\\.storage\\.capacity:\\n\\s+enabled: true"
      - matchRegex:
          path: data["relay"]
          pattern: "k8s\\.persistentvolumeclaim\\.storage\\.request:\\n\\s+enabled: true"
