suite: IBM Db2 subchart
values:
  - ./values/basic.yaml
release:
  name: test-release
  namespace: test-ns

tests:
  # `db2.enabled: false` has to stay present in values.yaml: Helm ignores a `condition`
  # whose values path does not resolve and installs the subchart anyway. Deleting the key
  # makes the chart fail to render at its own defaults, which ci_scripts/check-render.sh
  # catches across every example. This asserts the other half — that the condition is
  # wired to the key at all, rather than the subchart being installed unconditionally.
  # `db2.enabled: false` has to stay present in values.yaml: Helm ignores a `condition`
  # whose values path does not resolve and installs the subchart anyway. Deleting the key
  # makes the chart fail to render at its own defaults, which ci_scripts/check-render.sh
  # catches across every example. This asserts the other half — that the condition is
  # wired to the key at all, rather than the subchart being installed unconditionally.
  - it: should render the receiver when enabled
    template: charts/db2/templates/deployment.yaml
    set:
      gateway.enabled: true
      db2:
        enabled: true
        receivers:
          - name: default
            hostname: db2.example.com
            database: PROD
            port: 50001
            credentialsSecret: my-db2-credentials
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment

  # The receiver image is Linux-only.
  # The receiver image is Linux-only.
  - it: should schedule the receiver on Linux
    template: charts/db2/templates/deployment.yaml
    set:
      gateway.enabled: true
      db2:
        enabled: true
        receivers:
          - name: default
            hostname: db2.example.com
            database: PROD
            port: 50001
            credentialsSecret: my-db2-credentials
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            kubernetes.io/os: linux

  # The derived endpoint has to name a Service this release actually creates, so the two
  # charts' naming conventions are asserted together without standing up a cluster.
  # The derived endpoint has to name a Service this release actually creates, so the two
  # charts' naming conventions are asserted together without standing up a cluster.
  - it: should derive the agent endpoint from the release
    template: charts/db2/templates/configmap.yaml
    set:
      db2:
        otlp:
          collectorTarget: agent
        enabled: true
        receivers:
          - name: default
            hostname: db2.example.com
            database: PROD
            port: 50001
            credentialsSecret: my-db2-credentials
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'endpoint: "http://test-release-splunk-otel-collector-agent\.test-ns\.svc\.cluster\.local:4317"'
  - it: should target the gateway when asked
    template: charts/db2/templates/configmap.yaml
    set:
      gateway.enabled: true
      db2:
        enabled: true
        otlp:
          collectorTarget: gateway
        receivers:
          - name: default
            hostname: db2.example.com
            database: PROD
            port: 50001
            credentialsSecret: my-db2-credentials
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'endpoint: "http://test-release-splunk-otel-collector\.test-ns\.svc\.cluster\.local:4317"'

  # Db2 requires ssl_svcename to listen on a different port from svcename, so the
  # cleartext default cannot be reused once TLS is on. Asserted on secret.yaml because
  # that is where the shared validation helper is reached first.
  # Db2 requires ssl_svcename to listen on a different port from svcename, so the
  # cleartext default cannot be reused once TLS is on. Asserted on secret.yaml because
  # that is where the shared validation helper is reached first.
  - it: should refuse TLS without an explicit port
    template: charts/db2/templates/secret.yaml
    set:
      db2:
        enabled: true
        receivers:
          - name: default
            hostname: db2.example.com
            database: PROD
            credentialsSecret: my-db2-credentials
    asserts:
      - failedTemplate:
          errorPattern: "port is required when TLS is enabled"
  - it: should refuse a receiver with no credentials
    template: charts/db2/templates/secret.yaml
    set:
      db2:
        enabled: true
        receivers:
          - name: default
            hostname: db2.example.com
            database: PROD
            port: 50001
    asserts:
      - failedTemplate:
          errorPattern: "needs credentials"

  # The routing rule is in the gateway config, but the subchart exports to the agent by
  # default, and the agent has no pipeline receiving OTLP logs in Observability-only mode.
  # That combination rendered cleanly while query-sample events were rejected at the agent
  # with UNIMPLEMENTED, so it has to fail at template time instead.
  # Helm passes parent values down only through global, so the subchart cannot see these
  # and would derive a Service name that was never created.
  - it: should refuse deriving the gateway address under fullnameOverride
    set:
      splunkObservability.realm: us0
      splunkObservability.accessToken: token
      clusterName: test
      gateway.enabled: true
      fullnameOverride: custom-gw
      db2:
        enabled: true
        dbMonitoring:
          enabled: true
        otlp:
          collectorTarget: gateway
        receivers:
          - name: default
            hostname: db2.example.com
            database: PROD
            port: 50001
            credentialsSecret: my-db2-credentials
    asserts:
      - failedTemplate:
          errorPattern: "cannot derive the Collector address while nameOverride or fullnameOverride is set"
  - it: should require collectorNamespace alongside namespaceOverride
    set:
      splunkObservability.realm: us0
      splunkObservability.accessToken: token
      clusterName: test
      gateway.enabled: true
      namespaceOverride: elsewhere
      db2:
        enabled: true
        dbMonitoring:
          enabled: true
        otlp:
          collectorTarget: gateway
        receivers:
          - name: default
            hostname: db2.example.com
            database: PROD
            port: 50001
            credentialsSecret: my-db2-credentials
    asserts:
      - failedTemplate:
          errorPattern: "would derive the Collector in namespace"

  # The functional test redirects this exporter to its own sink, so the derived form is
  # only covered here.
  # Applies to plain metrics too: the derived address is wrong under these overrides
  # whichever target is used, and the export goes into a name that does not resolve.
  - it: should refuse a derived address under fullnameOverride without database monitoring
    set:
      splunkObservability.realm: us0
      splunkObservability.accessToken: token
      clusterName: test
      gateway.enabled: true
      fullnameOverride: custom-gw
      db2:
        enabled: true
        receivers:
          - name: default
            hostname: db2.example.com
            database: PROD
            port: 50001
            credentialsSecret: my-db2-credentials
    asserts:
      - failedTemplate:
          errorPattern: "db2.enabled cannot derive the Collector address"

  # The subchart derives the address of whichever Collector collectorTarget names, but cannot
  # see whether this release deploys it.
  - it: should refuse the gateway target when no gateway is deployed
    set:
      db2:
        enabled: true
        otlp:
          collectorTarget: gateway
        receivers:
          - name: default
            hostname: db2.example.com
            database: PROD
            port: 50001
            credentialsSecret: my-db2-credentials
    asserts:
      - failedTemplate:
          errorPattern: "but gateway.enabled is false"

  - it: should refuse the agent target when no agent is deployed
    set:
      agent.enabled: false
      gateway.enabled: true
      db2:
        enabled: true
        otlp:
          collectorTarget: agent
        receivers:
          - name: default
            hostname: db2.example.com
            database: PROD
            port: 50001
            credentialsSecret: my-db2-credentials
    asserts:
      - failedTemplate:
          errorPattern: "but agent.enabled is false"
