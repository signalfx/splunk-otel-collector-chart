suite: Experimental Talos Linux support
values:
  - ./values/basic.yaml
templates:
  - daemonset.yaml
  - configmap-agent.yaml

tests:
  - it: omits unavailable Talos host paths while keeping host metrics and container logs
    template: daemonset.yaml
    set:
      distribution: talos
      splunkPlatform.endpoint: https://splunk.example.com:8088/services/collector
      splunkPlatform.token: test
    asserts:
      - notContains:
          any: true
          path: spec.template.spec.volumes
          content:
            name: host-usr-lib-osrelease
      - notContains:
          any: true
          path: spec.template.spec.volumes
          content:
            name: varlibdockercontainers
      - notContains:
          any: true
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: host-usr-lib-osrelease
      - notContains:
          any: true
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: varlibdockercontainers
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-etc
            hostPath:
              path: /etc
      - contains:
          path: spec.template.spec.volumes
          content:
            name: varlog
            hostPath:
              path: /var/log
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: varlog
            mountPath: /var/log
            readOnly: true

  - it: retains log permissions initialization without mounting Docker paths on Talos
    template: daemonset.yaml
    set:
      distribution: talos
      splunkPlatform.endpoint: https://splunk.example.com:8088/services/collector
      splunkPlatform.token: test
      agent.securityContext.runAsUser: 1000
      agent.securityContext.runAsGroup: 1000
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: varlog
            mountPath: /var/log
      - notContains:
          any: true
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: varlibdockercontainers
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: checkpoint
            mountPath: /var/addon/splunk/otel_pos

  - it: discovers the Talos API server on port 6443 with legacy receivers
    template: configmap-agent.yaml
    set:
      distribution: talos
      featureGates.useControlPlaneMetricsHistogramData: false
    postRenderer:
      cmd: yq
      args: [eval, '.data.relay |= (from_yaml | .receivers.receiver_creator.receivers."smartagent/kubernetes-apiserver")', '-']
    asserts:
      - equal:
          path: data.relay.rule
          value: 'type == "pod" && (labels["k8s-app"] == "kube-apiserver" || labels["component"] == "kube-apiserver")'
      - equal:
          path: data.relay.config.port
          value: 6443

  - it: discovers the Talos API server on port 6443 with native receivers
    template: configmap-agent.yaml
    set:
      distribution: talos
    postRenderer:
      cmd: yq
      args: [eval, '.data.relay |= (from_yaml | .receivers.receiver_creator.receivers."prometheus/kubernetes-apiserver")', '-']
    asserts:
      - equal:
          path: data.relay.rule
          value: 'type == "pod" && (labels["k8s-app"] == "kube-apiserver" || labels["component"] == "kube-apiserver")'
      - equal:
          path: data.relay.config.config.scrape_configs[0].static_configs[0].targets
          value: ['`joinHostPort(endpoint, 6443)`']

  - it: requires an explicit cluster name on Talos
    template: daemonset.yaml
    set:
      distribution: talos
      clusterName: ""
    asserts:
      - failedTemplate:
          errorPattern: /clusterName

  - it: rejects Windows workloads on Talos Linux
    template: daemonset.yaml
    set:
      distribution: talos
      isWindows: true
    asserts:
      - failedTemplate:
          errorPattern: /isWindows
