apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-config
data:
  config.yaml: |
    receivers:
      host_metrics:
        collection_interval: 1s
        scrapers:
          cpu:

    exporters:
      signalfx:
        access_token: standalonePodToken
        api_url: http://sock-splunk-otel-collector.default.svc.cluster.local:6060
        ingest_url: http://sock-splunk-otel-collector.default.svc.cluster.local:9943
        tls:
          insecure: true

    service:
      pipelines:
        metrics:
          receivers:
            - host_metrics
          exporters:
            - signalfx
---
apiVersion: v1
kind: Pod
metadata:
  name: standalone-splunk-otel-collector
spec:
  restartPolicy: OnFailure
  containers:
    - name: otel-collector
      image: quay.io/signalfx/splunk-otel-collector:latest
      args:
        - --config=/etc/otelcol/config.yaml
      volumeMounts:
        - name: collector-config
          mountPath: /etc/otelcol
          readOnly: true
  volumes:
    - name: collector-config
      configMap:
        name: collector-config
