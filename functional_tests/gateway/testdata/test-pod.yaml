apiVersion: v1
kind: ConfigMap
metadata:
  name: otlp-json-file-collector
data:
  relay.yaml: |
    receivers:
      host_metrics:
        collection_interval: 1s
        scrapers:
          cpu:

    exporters:
      signalfx:
        access_token: CHANGEME
        api_url: http://sock-splunk-otel-collector.default.svc.cluster.local:6060
        ingest_url: http://sock-splunk-otel-collector.default.svc.cluster.local:9943
        tls:
          insecure: true

    service:
      pipelines:
        metrics:
          receivers:
            - host_metrics
          exporters:
            - signalfx
---
apiVersion: v1
kind: Pod
metadata:
  name: file-uploader-pod
spec:
  restartPolicy: OnFailure
  containers:
    - name: otel-collector
      image: quay.io/signalfx/splunk-otel-collector:0.156.0
      args:
        - --config=/etc/otelcol/relay.yaml
      volumeMounts:
        - name: otlp-json-file-collector
          mountPath: /etc/otelcol
          readOnly: true
  volumes:
    - name: otlp-json-file-collector
      configMap:
        name: otlp-json-file-collector
