# Metrics the Db2 receiver emits with no opt-in collection enabled, so this asserts the
# default path reaching the Collector through the subchart.
#
# Deliberately a small, stable subset rather than all 57 the receiver can emit: query
# samples, top queries and blocking sessions are opt-in and already covered by the
# receiver's own suite, and asserting everything would make this test fail on unrelated
# additions there.
version: 1
signal: metrics
resources:
  - scopes:
      - metrics/include:
          - name: db2.connection.active
            type: gauge
          - name: db2.connection.count
            type: gauge
          - name: db2.buffer_pool.logical_reads
            type: gauge
          - name: db2.buffer_pool.physical_reads
            type: gauge
          - name: db2.lock.wait.count
            type: gauge
          - name: db2.deadlock.count
            type: gauge
