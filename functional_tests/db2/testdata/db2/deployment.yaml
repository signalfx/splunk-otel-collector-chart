apiVersion: apps/v1
kind: Deployment
metadata:
  name: db2
  labels:
    app: db2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db2
  template:
    metadata:
      labels:
        app: db2
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: db2
          image: icr.io/db2_community/db2:11.5.9.0
          imagePullPolicy: IfNotPresent
          securityContext:
            # The image runs its own init, manages kernel params and writes outside the
            # container filesystem; it does not start unprivileged.
            privileged: true
          env:
            - name: LICENSE
              value: accept
            - name: DB2INST1_PASSWORD
              value: db2inst1-pwd
            - name: DBNAME
              value: SAMPLE
            - name: ARCHIVE_LOGS
              value: "false"
            - name: AUTOCONFIG
              value: "false"
          ports:
            - containerPort: 50000
          readinessProbe:
            exec:
              # Db2 accepts TCP long before the database is usable, so probe with a real
              # query rather than a port check.
              command:
                - /bin/bash
                - -c
                - su - db2inst1 -c "db2 connect to SAMPLE && db2 'select 1 from sysibm.sysdummy1'"
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 20
            failureThreshold: 30
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - name: database
              mountPath: /database
      volumes:
        - name: database
          emptyDir: {}
