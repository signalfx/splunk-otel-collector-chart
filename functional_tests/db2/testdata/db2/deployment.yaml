apiVersion: apps/v1
kind: Deployment
metadata:
  name: db2
  labels:
    app: db2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db2
  template:
    metadata:
      labels:
        app: db2
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: db2
          image: icr.io/db2_community/db2:11.5.9.0
          imagePullPolicy: IfNotPresent
          securityContext:
            # The image runs its own init, manages kernel params and writes outside the
            # container filesystem; it does not start unprivileged.
            privileged: true
          env:
            - name: LICENSE
              value: accept
            - name: DB2INST1_PASSWORD
              value: db2inst1-pwd
            - name: DBNAME
              value: SAMPLE
            - name: ARCHIVE_LOGS
              value: "false"
            - name: AUTOCONFIG
              value: "false"
          ports:
            - containerPort: 50000
          # An idle Db2 produces no query events: the sampler reads currently-running
          # activities and finds none, and the package cache may hold nothing the receiver
          # considers a top query. The assertion on logs/dbmon then passes or fails on
          # chance -- it passed on one Kubernetes version and failed on two others.
          #
          # This gives the instance a steady trickle of statements instead. It runs in this
          # container so it uses the local instance directly, and backgrounds itself so
          # postStart returns immediately rather than blocking startup. Failures while Db2
          # is still booting are expected and ignored; the loop simply retries.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    nohup bash -c 'while true; do
                      su - db2inst1 -c "db2 connect to SAMPLE && db2 \"select count(*) from syscat.tables\" && db2 \"select * from syscat.columns fetch first 200 rows only\"" >/dev/null 2>&1
                      sleep 5
                    done' >/dev/null 2>&1 &
                    # Kubernetes terminates the container if a postStart hook fails, so this
                    # never reports one. The loop is best effort; the assertions report its
                    # absence far more usefully than a restarting Db2 would.
                    exit 0
          # A startupProbe confines the large threshold to first boot, so a later stall is
          # still reported promptly. The threshold is headroom for a cold image pull; a
          # startupProbe only spends the time Db2 actually needs.
          startupProbe:
            exec:
              # A real connection, not a port check: the listener answers long before the
              # database is usable.
              command: ["/bin/bash", "-c", "su - db2inst1 -c 'db2 connect to SAMPLE'"]
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 15
            # 60s + 48*15s = 13m, which has to stay inside db2ReadyTimeout so the Go wait
            # reports a stalled fixture rather than the suite deadline firing first.
            failureThreshold: 48
          readinessProbe:
            exec:
              command: ["/bin/bash", "-c", "su - db2inst1 -c 'db2 connect to SAMPLE'"]
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - name: database
              mountPath: /database
      volumes:
        - name: database
          emptyDir: {}
