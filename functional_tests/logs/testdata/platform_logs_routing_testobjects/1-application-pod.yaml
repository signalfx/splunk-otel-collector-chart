apiVersion: v1
kind: Pod
metadata:
  name: application-precedence
  namespace: platform-logs-routing-precedence
  labels:
    test: platform-logs-routing-precedence
    product: application
  annotations:
    splunk.com/index: pod-index
    splunk.com/sourcetype: pod:sourcetype
spec:
  automountServiceAccountToken: false
  containers:
    - name: application-precedence
      image: busybox:1.37
      env:
        - name: RUN_ID
          valueFrom:
            configMapKeyRef:
              name: platform-logs-routing-run
              key: run-id
      command: ["sh", "-c", "echo ${RUN_ID}:K8S_APPLICATION_ROUTE_MARKER; sleep 3600"]
  nodeSelector:
    kubernetes.io/os: "linux"
