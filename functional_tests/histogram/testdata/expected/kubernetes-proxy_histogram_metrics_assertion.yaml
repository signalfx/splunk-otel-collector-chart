resources:
    - attributes:
        host.name: kind-control-plane
        k8s.cluster.name: sock
        k8s.namespace.name: kube-system
        k8s.node.name: kind-control-plane
        k8s.pod.name/regex: '^kube-proxy-[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
        k8s.pod.uid/regex: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        os.type: linux
        server.address/exists: true
        server.port/exists: true
        service.instance.id/exists: true
        service.name: kubernetes-proxy
        url.scheme: http
      scopes:
        - metrics:
            - datapoints:
                - attributes:
                    ip_family/exists: true
                  explicit_bounds:
                    - 0.5
                    - 3
                    - 6
                    - 9
                    - 12
                    - 15
                    - 18
                    - 21
                    - 24
                    - 27
                    - 30
                    - 33
                    - 36
                    - 39
                    - 42
                    - 45
                    - 48
                    - 51
                    - 54
                    - 57
                    - 60
                    - 75
                    - 90
                    - 105
                    - 120
                    - 210
                    - 300
              name: kubeproxy_network_programming_duration_seconds
              temporality: cumulative
              type: histogram
            - datapoints:
                - attributes:
                    ip_family/exists: true
                  explicit_bounds:
                    - 0.001
                    - 0.002
                    - 0.004
                    - 0.008
                    - 0.016
                    - 0.032
                    - 0.064
                    - 0.128
                    - 0.256
                    - 0.512
                    - 1.024
                    - 2.048
                    - 4.096
                    - 8.192
                    - 16.384
              name: kubeproxy_sync_proxy_rules_duration_seconds
              temporality: cumulative
              type: histogram
          name: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver
          version/regex: v[0-9]+\.[0-9]+\.[0-9]+
signal: metrics
version: 1
